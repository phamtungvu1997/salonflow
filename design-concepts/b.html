<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Konzept B — Atelier</title>
  <link rel="stylesheet" href="b.css?v=2" />
</head>
<body>
  <div class="app">
    <aside class="nav">
      <p class="mark">Jeannie</p>
      <p class="sub">Nagelstudio · Hamburg</p>
      <nav>
        <a class="on" href="#kalender">Kalender</a>
        <a href="#kunden">Kunden</a>
        <a href="#team">Team</a>
        <a href="#leistungen">Leistungen</a>
        <a href="#einstellungen">Einstellungen</a>
      </nav>
    </aside>
    <section class="workspace">
      <header class="toolbar">
        <div class="date">
          <button type="button" aria-label="Vorheriger Tag">‹</button>
          <div><b>Montag 9. November</b><span>Jeannie · 10 im Dienst</span></div>
          <button type="button" aria-label="Nächster Tag">›</button>
        </div>
        <div class="switch"><button type="button" class="on">Tag</button><button type="button">Woche</button></div>
        <button class="text" type="button">Heute</button>
        <span class="grow"></span>
        <button class="primary" type="button">Termin anlegen</button>
      </header>
      <div class="board" id="board"></div>
    </section>
    <form class="sheet">
      <p class="kicker">Termin anlegen</p>
      <h2>11:00 – 11:45</h2>
      <p class="who">Lea · frei</p>
      <section>
        <h3>Wer</h3>
        <input placeholder="Kundin suchen" />
        <button type="button" class="link">Neue Kundin</button>
      </section>
      <section>
        <h3>Was</h3>
        <select><option>Shellac Natur · 45 Min. · 35 €</option></select>
      </section>
      <section>
        <h3>Wann</h3>
        <div class="pair"><input value="11:00" /><input value="45 Min." /></div>
      </section>
      <label class="note">Notiz<textarea placeholder="Nur für das Team"></textarea></label>
      <footer>
        <button type="button" class="quiet">Verwerfen</button>
        <button type="button" class="primary">Speichern</button>
      </footer>
    </form>
  </div>
  <script src="studio.js"></script>
  <script src="b.js?v=4"></script>
</body>
</html>
